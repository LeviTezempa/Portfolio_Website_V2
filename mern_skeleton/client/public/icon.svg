<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Levi's Tech logo icon</title>
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f6f9"/>
      <stop offset="0.25" stop-color="#8f98a4"/>
      <stop offset="0.5" stop-color="#e9edf1"/>
      <stop offset="0.75" stop-color="#5b626c"/>
      <stop offset="1" stop-color="#dfe3e8"/>
    </linearGradient>
    <radialGradient id="disc" cx="0.38" cy="0.28" r="0.85">
      <stop offset="0" stop-color="#454c56"/>
      <stop offset="0.55" stop-color="#20242a"/>
      <stop offset="1" stop-color="#0b0d10"/>
    </radialGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="light" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#c3cad3"/>
      <stop offset="1" stop-color="#8e97a3"/>
    </linearGradient>
    <linearGradient id="lightH" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8e97a3"/>
      <stop offset="0.5" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c3cad3"/>
    </linearGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6b7480"/>
      <stop offset="1" stop-color="#252a31"/>
    </linearGradient>
    <linearGradient id="darkV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a838f"/>
      <stop offset="1" stop-color="#2b3037"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#a5aeb9"/>
    </linearGradient>
    <linearGradient id="accent" gradientUnits="userSpaceOnUse" x1="655" y1="0" x2="815" y2="0">
      <stop offset="0" stop-color="#1f7fe0"/>
      <stop offset="1" stop-color="#7fd6ff"/>
    </linearGradient>
    <clipPath id="clipDisc"><circle cx="512" cy="512" r="470"/></clipPath>
  </defs>

  <!-- badge -->
  <circle cx="512" cy="512" r="500" fill="url(#ring)"/>
  <circle cx="512" cy="512" r="474" fill="#0b0d10"/>
  <circle cx="512" cy="512" r="466" fill="url(#disc)"/>
  <g clip-path="url(#clipDisc)">
    <ellipse cx="512" cy="230" rx="440" ry="250" fill="url(#gloss)"/>
  </g>
  <circle cx="512" cy="512" r="430" fill="none" stroke="#c9d0d8" stroke-opacity="0.22" stroke-width="2"/>

  <!-- L monogram -->
  <g transform="translate(462 448) skewX(-10) translate(-500 -440)">
    <!-- shadow -->
    <g fill="#000" opacity="0.35" transform="translate(8 12)">
      <polygon points="340,290 390,240 450,240 450,540 700,540 660,640 340,640"/>
    </g>
    <!-- stem -->
    <polygon points="340,290 390,240 395,240 395,590 340,640" fill="url(#light)"/>
    <polygon points="395,240 450,240 450,540 395,590" fill="url(#dark)"/>
    <!-- foot -->
    <polygon points="450,540 700,540 680,590 395,590" fill="url(#lightH)"/>
    <polygon points="395,590 680,590 660,640 340,640" fill="url(#darkV)"/>
    <!-- highlights -->
    <polyline points="340,640 340,290 390,240 450,240" fill="none" stroke="#fff" stroke-opacity="0.85" stroke-width="2.5" stroke-linejoin="round"/>
    <polyline points="450,540 700,540" fill="none" stroke="#fff" stroke-opacity="0.9" stroke-width="2.5"/>
    <!-- tech accent -->
    <line x1="668" y1="615" x2="812" y2="615" stroke="url(#accent)" stroke-width="5" stroke-linecap="round"/>
    <circle cx="822" cy="615" r="11" fill="#0b0d10" stroke="#5cc2ff" stroke-width="4"/>
  </g>

